<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Guesser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1e1e1e;
      color: #fff;
    }
    h1 {
      margin-top: 20px;
    }
    table, th, td {
        border:1px solid white;
    }
    .correct{
        background-color: lightgreen;
        color: black;
    }
    .incorrect{
        background-color: lightcoral;
        color: black;
    }
    .mid{
        background-color: lightgoldenrodyellow;
        color: black;
    }
    button {
        background-color: white;
        color: black;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
    }
    .centerTable {
        margin-left: auto;
        margin-right: auto;
    }
  </style>
</head>

<body>
  <h1>Character Guesser</h1>

  <h2>Auto-guesser the character from Genshin Impact</h2>

<table class="centerTable", id="ToMuchButtons">
<tr>
    <td></td> 
    <td></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(weapon, 0, this)">Sword</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 0, this)">Mondstadt</button></td>
    <td></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 0, this)">Anemo</button></td>
    <td></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 1, this)">Liyue</button></td>
    <td><button type="button" id="GuessButton-version" onclick="test_function(version, 0, this)">Up</button></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 1, this)">Geo</button></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(weapon, 1, this)">Claymore</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 2, this)">Inazuma</button></td>
    <td></td>
</tr>
<tr>
    <td><button type="button" id="GuessButton-rarity" onclick="test_function(rarity, 0, this)">4 star</button></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 2, this)">Electro</button></td>
    <td></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 3, this)">Sumeru</button></td>
    <td></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 3, this)">Dendro</button></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(weapon, 2, this)">Polearm</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 4, this)">Fontaine</button></td>
    <td><button type="button" id="GuessButton-version" onclick="test_function(version, 1, this)">Equale</button></td>
</tr>
<tr>
    <td><button type="button" id="GuessButton-rarity" onclick="test_function(rarity, 1, this)">5 star</button></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 4, this)">Hydro</button></td>
    <td></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 5, this)">Natlan</button></td>
    <td></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 5, this)">Pyro</button></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(weapon, 3, this)">Bow</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 6, this)">Nod-Kray</button></td>
    <td></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(element, 6, this)">Cryo</button></td>
    <td></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 7, this)">Snezhnaya</button></td>
    <td><button type="button" id="GuessButton-version" onclick="test_function(version, 2, this)">Down</button></td>
</tr>
<tr> 
    <td></td>
    <td></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(weapon, 4, this)">Catalyst</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(region, 8, this)">Outlander</button></td>
    <td></td>
</tr>
</table>
<br>
<table style="width:100%", id="Trysss">
    <tr>
        <td>Number</td> <td>Name</td> <td>Rarity</td> <td>Element</td> <td>Weapon</td> <td>Region</td> <td>Version</td>
    </tr>
</table>
<br>
<button type="button" id="re" onclick="PrintTable()">Print</button>
<br>
<label id="test"></label>


  <script>
    let Characters = [
        ["1", "Albedo", "5", "Geo", "Sword", "Mondstadt", 1.2],
        ["2", "Aloy", "5", "Cryo", "Bow", "Outlander", 1.3],
        ["3", "Amber", "4", "Pyro", "Bow", "Mondstadt", 1.0],
        ["4", "Arataki Itto", "5", "Geo", "Claymore", "Inazuma", 1.6],
        ["5", "Barbara", "4", "Hydro", "Catalyst", "Mondstadt", 1.0]
    ];

    let rarity = [0, 0]; // 4 star, 5 star
    let element = [0, 0, 0, 0, 0, 0, 0]; // Anemo, Geo, Electro, Dendro, Hydro, Pyro, Cryo
    let weapon = [0, 0, 0, 0, 0]; // Sword, Claymore, Polearm, Bow, Catalyst
    let region = [0, 0, 0, 0, 0, 0, 0, 0, 0]; // Mondstadt, Liyue, Inazuma, Sumeru, Fontaine, Natlan, Nod-Kray, Snezhnaya, Outlander
    let version = [0, 0, 0]; // up, equale, down

    function test_function(thing, id, btn){
        thing[id] += 1;
        if (thing[id] == 3) thing[id] = 0;
        
        switch(thing[id]){
            case 0:
                btn.style.backgroundColor = "white";
                break;
            case 1:
                btn.style.backgroundColor = "green";
                break;
            case 2:
                btn.style.backgroundColor = "red";
                break;
        }

        document.getElementById("test").innerText = thing;
    }

    function PrintTable() {
        var table = document.getElementById("Trysss");
        document.getElementById("test").innerText = rarity.indexOf(1);
        for (let i = 0; i <Characters.length; i++) {
            switch (rarity.indexOf(1)) {
                case -1:
                    var row = table.insertRow(-1);
                    for (let j = 0; j < 7; j++) {
                        var cell = row.insertCell(j);
                        cell.innerHTML = Characters[i][j];
                    }
                    break;
                case 0:
                    if (Characters[i][2] != "4") continue;
                    var row = table.insertRow(-1);
                    for (let j = 0; j < 7; j++) {
                        var cell = row.insertCell(j);
                        cell.innerHTML = Characters[i][j];
                    }
                    break;
                case 1:
                    if (Characters[i][2] != "5") continue;
                    var row = table.insertRow(-1);
                                   for (let j = 0; j < 7; j++) {
                        var cell = row.insertCell(j);
                        cell.innerHTML = Characters[i][j];
                    }
                    break;
            }
        }
    }
  </script>
</body>
</html>
