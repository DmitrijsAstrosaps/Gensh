<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Guesser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1e1e1e;
      color: #fff;
    }
    h1 {
      margin-top: 20px;
    }
    table, th, td {
        border:1px solid white;
    }
    .correct{
        background-color: lightgreen;
        color: black;
    }
    .incorrect{
        background-color: lightcoral;
        color: black;
    }
    .mid{
        background-color: lightgoldenrodyellow;
        color: black;
    }
    button {
        background-color: white;
        color: black;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
    }
  </style>
</head>

<body>
  <h1>Character Guesser</h1>

  <h2>Auto-guesser the character from Genshin Impact</h2>
  <table style="width:100%", id="Trysss">
    <tr>
        <td>Number</td> <td>Name</td> <td>Rarity</td> <td>Element</td> <td>Weapon</td> <td>Region</td> <td>Version</td>
    </tr>
  </table>
  <br>
    <label for="Guess">Guess the characters:</label><br>
    <input type="text" id="Guess" oninput="">
    <br>
    <br>
    <button type="button" id="GuessButton" onclick="test_function(0)">Test1</button>
    <button type="button" id="GuessButton" onclick="test_function(1)">Test2</button>
    <button type="button" id="GuessButton" onclick="test_function(2)">Test3</button>
    <button type="button" id="GuessButton" onclick="test_function(3)">Test4</button>
    <button type="button" id="GuessButton" onclick="test_function(4)">Test5</button>
    <br>
    <label id="test"></label>

  <script>
    let num = [0, 0, 0, 0, 0];
    const button = document.querySelectorAll('#GuessButton');
    button.forEach(btn => {
        btn.addEventListener('click', () => {
            switch(num[0]){
                case 0:
                    btn.style.backgroundColor = 
                    "white";
                    break;
                case 1:
                    btn.style.backgroundColor = 
                    "green";
                    break;
                case 2:
                    btn.style.backgroundColor = 
                    "red";
                    break;
            }
        });
    });

    function test_function(count){
        num[count] += 1;
        if (num[count] == 3){
            num[count] = 0;
        }
        document.getElementById("test").innerText = num;
    }
  </script>
</body>
</html>
