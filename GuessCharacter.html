<!DOCTYPE html>
<html lang="en">
<head>
    <script src="Character_List_Script.js"></script>
    <link rel="stylesheet" href="Character_List_Style.css">
    <meta charset="UTF-8">
    <title>Character Guesser</title>
</head>

<body>
  <h1>Character Guesser</h1>

  <h2>Auto-guesser the character from Genshin Impact</h2>
<div id="wrapper">
    <div id="table-container">
        <table class="centerTable" id="ToMuchButtons">
            <thead>
                <tr>
                    <th>Rarity</th>
                    <th>Element</th>
                    <th>Weapon</th>
                    <th>Region</th>
                    <th>Version</th>
                </tr>
            </thead>
            <tbody>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>
    <div id="bestParam">
        <img id="bestImage" src="images/Characters_Icons/No character found_Icon.webp" alt="Character">
        <div id="bestContent">
            <h2 id="bestName">Character</h2>
            <div class="bestScore">
                Score: <span id="bestScore">0</span>
            </div>
            <div class="bestCount">
                Remaining: <span id="bestCount">0</span>
            </div>
            <div class="bestInfo">
                <div id="bestElement">Element: </div>
                <div id="bestWeapon">Weapon: </div>
                <div id="bestRegion">Region: </div>
                <div id="bestVersion">Version: </div>
                <div id="frequency">Frequency: </div>
            </div>
        </div>
        <div>
            <img style="width: 60px; height: 60px;" src="images/UI_Icons/reset_icon.png" alt="reset" class="imageButton" onclick="reset()">
            <img style="width: 60px; height: 60px;" src="images/UI_Icons/upload_icon.png" alt="print" class="imageButton" onclick="printAll()">
        </div>
    </div>
</div>
<div class="tableWrapper">
    <table id="Trysss" >
        <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Rarity</th>
                <th>Element</th>
                <th>Weapon</th>
                <th>Region</th>
                <th>Version</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
</body>
</html>
