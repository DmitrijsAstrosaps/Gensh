<body>
  <h1>Character Guesser</h1>

  <h2>Auto-guesser the character from Genshin Impact</h2>

<table class="centerTable", id="ToMuchButtons">
<tr>
    <td></td> 
    <td></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(dataButtons[2], 0, this)">Sword</button></td>

<tr>

</tr>

    <td></td>
</tr>
<tr>
    <td></td>
    <td><button type="button" id="GuessButton-element" onclick="test_function(dataButtons[1], 5, this)">Pyro</button></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(dataButtons[2], 3, this)">Bow</button></td>

</tr>
<tr> 
    <td></td>
    <td></td>
    <td><button type="button" id="GuessButton-weapon" onclick="test_function(dataButtons[2], 4, this)">Catalyst</button></td>
    <td><button type="button" id="GuessButton-region" onclick="test_function(dataButtons[3], 8, this)">Outlander</button></td>
    <td></td>
</tr>
</table>
<br>
<button type="button" id="re" onclick="PrintTable()">Print</button>
<br>
<label id="test"></label>
<br>
<table style="width:100%", id="Trysss">
    <tr>
        <td>Number</td> <td>Name</td> <td>Rarity</td> <td>Element</td> <td>Weapon</td> <td>Region</td> <td>Version</td>
    </tr>
</table>



  <script>
    let Characters = [
        ["1", "Albedo", "5", "Geo", "Sword", "Mondstadt", 1.2],
        ["2", "Aloy", "5", "Cryo", "Bow", "Outlander", 1.3],
        ["3", "Amber", "4", "Pyro", "Bow", "Mondstadt", 1.0],
        ["4", "Arataki Itto", "5", "Geo", "Claymore", "Inazuma", 1.6],
        ["5", "Barbara", "4", "Hydro", "Catalyst", "Mondstadt", 1.0]
    ];

    let dataNames = [
        ["4", "5"], 
        ["Anemo", "Geo", "Electro", "Dendro", "Hydro", "Pyro", "Cryo"], 
        ["Sword", "Claymore", "Polearm", "Bow", "Catalyst"], 
        ["Mondstadt", "Liyue", "Inazuma", "Sumeru", "Fontaine", "Natlan", "Nod-Krai", "Snezhnaya", "Outlander"]
    ];

    let dataButtons = [
        [0, 0], // 4 star, 5 star
        [0, 0, 0, 0, 0, 0, 0], // Anemo, Geo, Electro, Dendro, Hydro, Pyro, Cryo
        [0, 0, 0, 0, 0], // Sword, Claymore, Polearm, Bow, Catalyst
        [0, 0, 0, 0, 0, 0, 0, 0, 0], // Mondstadt, Liyue, Inazuma, Sumeru, Fontaine, Natlan, Nod-Krai, Snezhnaya, Outlander
        [0, 0, 0] // up, equale, down
    ];

    function test_function(thing, id, btn){
        thing[id] += 1;
        if (thing[id] == 3) thing[id] = 0;
        
        switch(thing[id]){
            case 0:
                btn.style.backgroundColor = "white";
                break;
            case 1:
                btn.style.backgroundColor = "green";
                break;
            case 2:
                btn.style.backgroundColor = "red";
                break;
        }

        document.getElementById("test").innerText = thing;
    }

    function PrintTable() {
        var table = document.getElementById("Trysss");
        while (table.rows.length > 1) {
            table.deleteRow(1);
        }
        for(i = 0; i < Characters.length; i++){
            let canPrint = true;
            for(j = 0; j < dataButtons.length-1; j++){
                for(k = 0; k < dataButtons[j].length; k++){
                    if(dataButtons[j][k] == 2 && Characters[i][j+2] == dataNames[j][k]){
                        canPrint = false;
                    }
                    if(dataButtons[j][k] == 1 && Characters[i][j+2] != dataNames[j][k]){
                        canPrint = false;
                    }
                }
            }
            if(canPrint){
                let row = table.insertRow();
                for(j = 0; j < Characters[i].length; j++){
                    let cell = row.insertCell();
                    cell.innerText = Characters[i][j];
                }
            }
        }
    }

  </script>
</body>
