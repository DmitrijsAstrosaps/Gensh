    </div>
    <div id="bestParam">
        <img id="bestImage" src="images/Characters_Icons/No character found_Icon.webp" alt="Character">
        <div id="bestContent">
            <h2 id="bestName">Character</h2>
            <div class="bestScore">
                Score: <span id="bestScore">0</span>
            </div>
            <div class="bestCount">
                Remaining: <span id="bestCount">0</span>
            </div>
            <div class="bestInfo">
                <div id="bestElement">Element: </div>
                <div id="bestWeapon">Weapon: </div>
                <div id="bestRegion">Region: </div>
                <div id="bestVersion">Version: </div>
                <div id="frequency">Frequency: </div>
            </div>
        </div>
        <div><button onclick="reset()">Reset Filters</button></div>
        <div><button onclick="printAll()">Print All</button></div>
    </div>
</div>
<br>
<div style="overflow-y: auto;">
    <table style="width:100%" id="Trysss" >
        <tr>
            <td>Number</td> <td>Name</td> <td>Rarity</td> <td>Element</td> <td>Weapon</td> <td>Region</td> <td>Version</td>
